server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/taskly_db

# Do not commit secrets. Provide credentials via env vars or application-local.properties
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Tu dong cap nhat schema database khi co thay doi trong Entity
spring.jpa.hibernate.ddl-auto=update

# Hien thi cau lenh SQL trong console de debug
spring.jpa.show-sql=true

# Format cau lenh SQL cho de doc
spring.jpa.properties.hibernate.format_sql=true
