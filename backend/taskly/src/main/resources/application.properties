server.port=8080

# Active profile for local development
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/taskly_db

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Tu dong cap nhat schema database khi co thay doi trong Entity
spring.jpa.hibernate.ddl-auto=update

# Hien thi cau lenh SQL trong console de debug
spring.jpa.show-sql=true

# Format cau lenh SQL cho de doc
spring.jpa.properties.hibernate.format_sql=true


# JWT settings
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=taskly-app
# app.jwt.audience=taskly-users
app.jwt.access-token-minutes=60
